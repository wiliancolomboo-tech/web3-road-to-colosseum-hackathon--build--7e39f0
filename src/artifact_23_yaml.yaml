version: "3.8"

services:
  aegis-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-enterprise-relayer
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=AegisVau1t1111111111111111111111111111111111
      - ENTERPRISE_WEBHOOK_URL=${ENTERPRISE_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FINANCE_ALERT_EMAIL=${FINANCE_ALERT_EMAIL}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"