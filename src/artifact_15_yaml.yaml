version: '3.8'

services:
  nexus-agent-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusvault-agent-worker
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=NexuSVauLt111111111111111111111111111111111
      - AGENT_SECRET_KEY=[1,2,3...your_key_bytes]
      - RESEND_API_KEY=re_live_enterprise_token_sample
      - AUDIT_RECIPIENT_EMAIL=cfo-ops@enterprise.org
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"