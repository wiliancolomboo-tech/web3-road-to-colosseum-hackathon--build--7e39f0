[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.26"

[features]
resolution = true
skip-lint = false

[programs.devnet]
aegis_sentinel = "Aegis11111111111111111111111111111111111111"

[programs.localnet]
aegis_sentinel = "Aegis11111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run mocha -r ts-node/register 'tests/**/*.spec.ts' --timeout 60000"