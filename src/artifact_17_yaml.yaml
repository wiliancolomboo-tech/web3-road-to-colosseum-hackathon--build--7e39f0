version: '3.8'

services:
  aegisflow-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=Aegis11111111111111111111111111111111111111
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ENTERPRISE_NOTIFICATION_EMAIL=${ENTERPRISE_NOTIFICATION_EMAIL:-treasury@enterprise.org}
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"