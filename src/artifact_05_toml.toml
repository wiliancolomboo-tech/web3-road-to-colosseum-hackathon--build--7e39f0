[package]
name = "kronos-protocol"
version = "0.1.0"
description = "Autonomous Enterprise Intent Escrow and Multi-Trigger Settlement Engine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kronos_protocol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }