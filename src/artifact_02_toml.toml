[package]
name = "aegis_engine"
version = "0.1.0"
description = "Enterprise Autonomous Agent Policy Firewall and Escrow on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "aegis_engine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"