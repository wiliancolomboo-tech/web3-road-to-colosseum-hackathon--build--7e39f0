[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.17"

[features]
seeds = true
skip-lint = false

[programs.localnet]
nexus_guard = "NexGrd1111111111111111111111111111111111111"

[programs.devnet]
nexus_guard = "NexGrd1111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"