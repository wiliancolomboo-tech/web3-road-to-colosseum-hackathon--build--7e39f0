version: "3.8"

services:
  sentry-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solsentry-sentinel-daemon
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WSS_URL=wss://api.devnet.solana.com
      - KEEPER_PRIVATE_KEY=[1,2,3,4,5,...] # Injected via secret vault in production
      - PROGRAM_ID=SntryV1111111111111111111111111111111111111
      - VAULT_MINT=So11111111111111111111111111111111111111112
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=alerts@sentryvault.fi
      - ALERT_RECIPIENT_EMAIL=treasury@company.com
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - POLL_INTERVAL_MS=15000
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3