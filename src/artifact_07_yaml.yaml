version: "3.8"

services:
  aether-telemetry-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aether_vault_worker
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=AethrV1111111111111111111111111111111111111
      - OPERATOR_PRIVATE_KEY=[1,2,3...255] # Injected via secret vault in CI/CD
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_test_000000000000000000000000
      - ALERT_EMAIL_RECIPIENT=dev-ops@aethervault.io
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').createConnection(8080).on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"