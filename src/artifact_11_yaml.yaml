version: "3.8"

services:
  kalyx-keeper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kalyx-sentinel-keeper
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./keys:/usr/src/app/keys:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"